<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voiceify - AI Voice Generator</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 20px; background: #f4f7f6; }
        h1 { color: #333; text-align: center; }
        textarea { width: 100%; height: 120px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; margin-bottom: 15px; box-sizing: border-box; }
        select, button { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; }
        button { background: #007bff; color: white; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background: #0056b3; }
        audio { width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>Voiceify 🎙️</h1>
    <p style="text-align:center;">कथा आणि व्लॉगसाठी मोफत AI आवाज तयार करा</p>

    <textarea id="text" placeholder="येथे तुमची कथा किंवा स्क्रिप्ट टाका..."></textarea>

    <select id="voice">
        <option value="mr-IN-AarohiNeural">मराठी (आरोही - Female)</option>
        <option value="mr-IN-ManoharNeural">मराठी (मनोहर - Male)</option>
        <option value="hi-IN-SwaraNeural">हिंदी (स्वरा - Female)</option>
        <option value="hi-IN-MadhurNeural">हिंदी (मधुर - Male)</option>
        <option value="en-US-JennyNeural">English (Jenny - Female)</option>
    </select>

    <button onclick="speakText()">आवाज ऐका (Speak)</button>

    <audio id="audioPlayer" controls style="display:none;"></audio>

    <script>
        function speakText() {
            const text = document.getElementById('text').value;
            if(!text) { alert('कृपया आधी काहीतरी स्क्रिप्ट लिहा!'); return; }
            
            const utterance = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(utterance);
        }
    </script>

</body>
</html>
